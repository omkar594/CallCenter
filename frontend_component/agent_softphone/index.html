<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Softphone</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Workstream 7: minimal WebRTC softphone for agents receiving press-1-to-agent transfers from
  the campaign dialer (and inbound ACD routing). Deliberately a single static page with a
  CDN-loaded SIP stack, matching this project's existing no-build-tooling frontend_component/
  convention for a small internal team - no bundler, no framework.

  Registers over the SAME [transport-wss] Asterisk already exposes for WebRTC (pjsip.conf),
  using SIP credentials fetched from GET /api/auth/me/sip-credentials right after login - the
  agent's own JWT is the only thing that can ever pull those credentials.
-->
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.25rem; }
  input, button { font-size: 1rem; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { cursor: pointer; }
  #status-banner { padding: 10px; border-radius: 6px; margin: 12px 0; font-weight: 600; text-align: center; }
  .status-offline { background: #fde2e2; color: #a11; }
  .status-online { background: #e2f7e2; color: #175917; }
  #incoming-call { display: none; padding: 16px; border: 2px solid #d99; border-radius: 8px; margin: 12px 0; background: #fff6f6; }
  .btn-row { display: flex; gap: 8px; }
  .btn-answer { background: #2e7d32; color: white; border: none; border-radius: 6px; }
  .btn-hangup { background: #c62828; color: white; border: none; border-radius: 6px; }
  #login-panel, #phone-panel { display: none; }
</style>
</head>
<body>
<h1>Agent Softphone</h1>

<div id="login-panel">
  <input id="username" placeholder="Username" autocomplete="username">
  <input id="password" placeholder="Password" type="password" autocomplete="current-password">
  <button id="login-btn">Log in</button>
  <p id="login-error" style="color:#a11"></p>
</div>

<div id="phone-panel">
  <div id="status-banner" class="status-offline">Connecting...</div>

  <div id="incoming-call">
    <p>Incoming call from <strong id="caller-id">-</strong></p>
    <div class="btn-row">
      <button class="btn-answer" id="answer-btn">Answer</button>
      <button class="btn-hangup" id="reject-btn">Reject</button>
    </div>
  </div>

  <div id="in-call" style="display:none">
    <p>On a call...</p>
    <button class="btn-hangup" id="hangup-btn">Hang Up</button>
  </div>

  <audio id="remote-audio" autoplay></audio>
</div>

<script src="https://cdn.jsdelivr.net/npm/jssip@3/dist/jssip.min.js"></script>
<script src="agent_softphone.js"></script>
</body>
</html>
