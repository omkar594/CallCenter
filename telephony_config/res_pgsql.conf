; =========================================================================
; res_config_pgsql - Asterisk Realtime Architecture DB connection (Workstream 7)
; =========================================================================
;
; Points Asterisk's realtime backend at the SAME Postgres database the Node backend uses
; (DATABASE_URL), so agent SIP endpoints provisioned via POST /api/auth/agents /
; GET /api/auth/me/sip-credentials (backend/services/agentProvisioningService.js) are visible
; to Asterisk immediately with no config file edits or reloads needed per agent.
;
; Requires res_config_pgsql to be installed and loaded first:
;   asterisk -rx "module show like res_config_pgsql"
;   asterisk -rx "module load res_config_pgsql.so"   ; if not already loaded
;
; The Postgres instance must be reachable FROM the EC2 box, not just from Render - if it's a
; managed Postgres that only allowlists Render's egress IPs, add the EC2 box's IP too.

[postgres]
dbname = REPLACE_WITH_DB_NAME
host = REPLACE_WITH_DB_HOST
user = REPLACE_WITH_DB_USER
password = REPLACE_WITH_DB_PASSWORD
port = 5432
requiressl = require
