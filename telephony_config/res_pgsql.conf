; =========================================================================
; res_config_pgsql - Asterisk Realtime Architecture DB connection (Workstream 7)
; =========================================================================
;
; Points Asterisk's realtime backend at the SAME Postgres database the Node backend uses
; (DATABASE_URL), so agent SIP endpoints provisioned via POST /api/auth/agents /
; GET /api/auth/me/sip-credentials (backend/services/agentProvisioningService.js) are visible
; to Asterisk immediately with no config file edits or reloads needed per agent.
;
; Requires res_config_pgsql to be installed and loaded first - it may be present but disabled:
;   asterisk -rx "module show like res_config_pgsql"
;   grep pgsql /etc/asterisk/modules.conf   ; comment out any "noload => res_config_pgsql.so"
;
; The Postgres instance must be reachable FROM the EC2 box, not just from Render - if it's a
; managed Postgres that only allowlists Render's egress IPs, add the EC2 box's IP too.
;
; IMPORTANT (confirmed live, cost real debugging time): the section MUST be named [general],
; not [postgres] or anything else, and every key needs its "db" prefix (dbhost, dbuser, dbpass,
; dbport, dbname) - plain `host`/`user`/`password`/`port` are silently ignored with no error,
; just a WARNING per field in the log ("No database host found, using localhost via socket"),
; and the module falls back to a useless default that can never connect.

[general]
dbname = REPLACE_WITH_DB_NAME
dbhost = REPLACE_WITH_DB_HOST
dbuser = REPLACE_WITH_DB_USER
dbpass = REPLACE_WITH_DB_PASSWORD
dbport = 5432
requiressl = require
