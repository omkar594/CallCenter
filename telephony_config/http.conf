; =========================================================================
; Asterisk Built-in HTTP/HTTPS Server - required for the WSS transport
; =========================================================================
;
; Counterintuitive but confirmed live: pjsip.conf's [transport-wss] section does NOT control
; the actual TLS certificate or bind address for WebSocket connections, despite having its own
; `bind=` line. Asterisk logs this explicitly on startup if you put cert_file/priv_key_file on
; the pjsip transport: "TLS certificate values ignored for websocket transport as they are
; configured in http.conf". The real listener is Asterisk's built-in mini-HTTP server, enabled
; and configured entirely in THIS file - pjsip.conf's transport-wss just tells PJSIP to offer
; a websocket-based SIP transport on top of whatever this server is already serving.
;
; Cert/key here are copies of the Let's Encrypt certificate (see README workstream 7 section)
; delivered to a location the `asterisk` user can actually read (Let's Encrypt's own files are
; root-only) - kept current automatically by a certbot deploy-hook at
; /etc/letsencrypt/renewal-hooks/deploy/asterisk-wss-cert.sh, which also restarts Asterisk.

[general]
servername=Asterisk
enabled=yes
bindaddr=0.0.0.0
;bindport=8088          ; plain-HTTP default port, not exposed in the security group

tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/wss-fullchain.pem
tlsprivatekey=/etc/asterisk/keys/wss-privkey.pem
