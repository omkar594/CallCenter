; =========================================================================
; Sorcery realtime mapping - dynamic per-agent PJSIP endpoints (Workstream 7)
; =========================================================================
;
; Chains BOTH wizards for each object type - Sorcery searches them in the order listed. A single
; `endpoint = realtime,ps_endpoints` line (no config,pjsip.conf line first) REPLACES the default
; static-file behavior entirely rather than adding to it - confirmed live on the EC2 box, this
; silently made the static [DinstarTrunk] endpoint in pjsip.conf invisible to Asterisk, breaking
; all outbound campaign calling. The explicit config,pjsip.conf line re-declares the normal
; static lookup so DinstarTrunk (and the static [1001] demo endpoint) keep working exactly as
; before, falling through to the Postgres-backed dynamic agent endpoints only when a static
; match isn't found.
;
; Realtime rows do NOT inherit pjsip.conf's `(!)` templates (e.g. [webrtc_agent_template]) -
; every field an agent endpoint needs (webrtc, ice_support, media_encryption, ...) is written
; explicitly into ps_endpoints by agentProvisioningService.js's INSERT, matching what that
; template sets, since the static/realtime boundary doesn't carry template inheritance across.

[res_pjsip]
endpoint = config,pjsip.conf,criteria=type=endpoint
endpoint = realtime,ps_endpoints
auth = config,pjsip.conf,criteria=type=auth
auth = realtime,ps_auths
aor = config,pjsip.conf,criteria=type=aor
aor = realtime,ps_aors
