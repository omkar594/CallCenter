; =========================================================================
; PJSIP Configuration Template - Low Latency WebRTC & Transcoding Avoidance
; =========================================================================

[global]
type=global
user_agent=Enterprise-Contact-Center

[system]
type=system
; QoS prioritization tags for audio packets (VIP priority routing)
tos_audio=ef
cos_audio=5

; WebSocket/WSS Transport setup
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; Standard UDP Transport for Gateway trunk connections
; external_media_address/external_signaling_address make Asterisk advertise its PUBLIC EC2 IP
; in Contact headers and SDP instead of the private AWS VPC address (172.31.x.x) that no
; remote peer (Dinstar, or anything outside this VPC) can ever reach. Without this, even a
; call that connects has broken audio/signaling because the far end tries to talk back to an
; address it cannot route to. Replace 13.205.220.6 if the EC2 instance's public IP changes
; (e.g. after a stop/start on a non-Elastic-IP instance).
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=13.205.220.6
external_signaling_address=13.205.220.6

; Generic template for WebRTC agent endpoints
; Note: Real endpoints can be fetched dynamically via Asterisk Realtime (ARA)
[webrtc_agent_template](!)
type=endpoint
transport=transport-wss
context=incoming-webrtc-context
webrtc=yes
use_avpf=yes
ice_support=yes
media_encryption=dtls
dtls_verify=no
dtls_setup=actpass
dtls_auto_generate_cert=yes
rtcp_mux=yes
; FORCE G.711 (alaw/ulaw) codec. Strictly disable Opus to prevent transcoding delays/CPU usage.
disallow=all
allow=alaw,ulaw

; AOR configuration template
[webrtc_aor_template](!)
type=aor
max_contacts=1
remove_existing=yes

; Authentication configuration template
[webrtc_auth_template](!)
type=auth
auth_type=userpass

; =========================================================================
; Example static declaration for verification/local debugging
; =========================================================================

[1001]
type=endpoint
allow=alaw,ulaw
