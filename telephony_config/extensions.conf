; =========================================================================
; Asterisk Dialplan Template - Voice Broadcasting & Campaign Manager
; =========================================================================

[general]
static=yes
writeprotect=no

[globals]
TRUNK=PJSIP/DinstarTrunk

; Context for receiving and routing WebRTC calls
[incoming-webrtc-context]
exten => _X.,1,NoOp(Inbound WebRTC Call from ${CALLERID(num)} to ${EXTEN})
same => n,Answer()
same => n,Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

; Context triggered by Backend Campaign Manager via AMI call origination
[campaign-broadcast-context]
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

exten => s,1,NoOp(Campaign Outbound Call Answered. Playing voice prompt immediately.)
same => n,Answer()
same => n,Wait(1) ; Brief pause to establish audio stream
same => n,Set(res=${CURL(http://127.0.0.1:5000/api/campaigns/callback?leadId=${LEAD_ID}&status=answered)})
same => n,Playback(${CAMPAIGN_AUDIO_PATH}) ; Play the transcoded wav file
same => n,Hangup()
