; =========================================================================
; Asterisk Dialplan Template - Voice Broadcasting & Campaign Manager
; =========================================================================

[general]
static=yes
writeprotect=no

[globals]
TRUNK=PJSIP/DinstarTrunk

; Context for receiving and routing WebRTC calls
[incoming-webrtc-context]
exten => _X.,1,NoOp(Inbound WebRTC Call from ${CALLERID(num)} to ${EXTEN})
same => n,Answer()
same => n,Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

; Context triggered by Backend Campaign Manager via AMI call origination.
; CAMPAIGN_AUDIO_FILE is the extension-less basename of a WAV pushed by the backend into this
; box's custom sounds directory (see ASTERISK_SOUNDS_DIR in backend/.env.example) - it is NOT
; a filesystem path anymore.
[campaign-broadcast-context]
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

exten => s,1,NoOp(Campaign Outbound Call Answered. Playing voice prompt immediately.)
same => n,Answer()
same => n,Wait(1) ; Brief pause to establish audio stream
; No mid-call status callback here on purpose - a CURL() fired right after Answer() (before
; Playback even starts) used to flip dial_status to 'answered' while the call, and the SIM
; port it holds, were still genuinely busy for the next 10-20s of playback. The worker's own
; AMI Hangup-event tracking (bulkCampaignWorker.js) is the only writer of dial_status now, so
; a port a campaign is actively using stays correctly counted as busy until the call truly ends.
same => n,Playback(campaign_audio/${CAMPAIGN_AUDIO_FILE}) ; Play the transcoded wav file
same => n,GotoIf($["${PLAYBACKSTATUS}" = "FAILED"]?playback_failed:done)
same => n(playback_failed),NoOp(Campaign audio file missing or unplayable: campaign_audio/${CAMPAIGN_AUDIO_FILE})
same => n,Playback(pbx-invalid) ; Audible fallback instead of silent dead air
same => n(done),Hangup()
